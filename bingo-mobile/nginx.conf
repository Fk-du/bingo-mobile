server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Expo Router static export: serve the per-route HTML when present,
    # otherwise fall back to the SPA shell for client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching of hashed assets is unnecessary (hashed names);
    # keep the default MIME config from nginx:alpine.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}