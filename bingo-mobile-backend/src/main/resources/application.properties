spring.application.name=bingo
spring.config.import=optional:file:.env[.properties]
spring.task.scheduling.pool.size=4

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080
# ===============================
# MASTER DATABASE (user auth + tenant registry)
# ===============================
master.datasource.url=${MASTER_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/bingo_master}}
master.datasource.username=${MASTER_DB_USERNAME:${DB_USERNAME:postgres}}
master.datasource.password=${MASTER_DB_PASSWORD:${DB_PASSWORD:}}

# ===============================
# BOT USERNAME AND TOKEN
# ===============================
app.telegram.bot.username=${BOT_USERNAME:}
app.telegram.bot.token=${BOT_TOKEN:}

# ===============================
# REGISTRATION-ONLY BOT (mobile-app onboarding)
# ===============================
app.telegram.registration-bot.username=${REGISTRATION_BOT_USERNAME:}
app.telegram.registration-bot.token=${REGISTRATION_BOT_TOKEN:}

# ===============================
# TENANT DATABASES (per-agent databases)
# ===============================
tenant.datasource.url=${TENANT_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/bingo_master}}
tenant.datasource.username=${TENANT_DB_USERNAME:${DB_USERNAME:postgres}}
tenant.datasource.password=${TENANT_DB_PASSWORD:${DB_PASSWORD:}}
tenant.datasource.default-database=bingo_master

# ===============================
# SERVER CONFIG
# ===============================
app.super-admin.telegram-id=${SUPER_ADMIN_TELEGRAM_ID:}

# ===============================
# SUPER-ADMIN BOOTSTRAP (mobile/phone+password deployments)
# ===============================
# When SUPER_ADMIN_PHONE + SUPER_ADMIN_PASSWORD are set and the JWT secret is
# configured, a SUPER_ADMIN account with that phone and password is ensured at
# startup so mobile onboarding can be tested without Telegram.
app.super-admin.phone=${SUPER_ADMIN_PHONE:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# SQL logging can expose query data (IDs, values). Enabled only via SHOW_SQL=true in dev.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prevent lazy loading issues in Telegram bot context
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.com.bingo=${APP_LOG_LEVEL:INFO}

# ===============================
# SECURITY BOOTSTRAP
# ===============================
# JWT for mobile-app (phone+password) auth. Secret must be >= 32 chars.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expires-minutes=${JWT_EXPIRES_MINUTES:10080}

# This app authenticates exclusively via Telegram-signed initData; it has no
# UserDetailsService and no login form. Disable Spring Boot's auto-configured
# in-memory user so no default "user" with a generated password is exposed.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ===============================
# TELEGRAM BOT CONFIG
# ===============================
# BOT_USERNAME and BOT_TOKEN must belong to the same Telegram bot account.
bingo.telegram.bot.username=${TELEGRAM_BOT_USERNAME:${BOT_USERNAME:}}
bingo.telegram.bot.token=${TELEGRAM_BOT_TOKEN:${BOT_TOKEN:}}
# The chat menu button opens bingo.webapp.url as a Telegram Mini App. Off by
# default: the game runs in the mobile app, and a Mini App button pointing at a
# URL nothing serves is worse than no button. When off, any button already
# handed out is reset to Telegram's default on bot start.
bingo.telegram.bot.webapp-button-enabled=${BOT_WEBAPP_BUTTON_ENABLED:false}

# ===============================
# BUSINESS CONFIG (BINGO RULES)
# ===============================
bingo.card-size=25
bingo.number-range=75
bingo.auto-call-interval-ms=5000

# reward split mode: EQUAL | WEIGHTED
bingo.reward-mode=EQUAL

# Fee and commission rates (e.g., 0.10 = 10%)
bingo.fees.admin-commission-percent=10

# ===============================
# SECURITY / SAFETY
# ===============================
app.registration.require-invite=true
app.multi-tenant.enabled=true
app.game.default-entry-fee=10
app.game.default-max-players=50

# Minimum cards every admin tenant is seeded/top-up'd to (see CardService.ensureInitialCardPool)
bingo.initial-card-pool=10000

# Telegram auth
bingo.telegram.auth.max-age-seconds=86400

# WEBAPP URL (set via environment variable or ..env)
bingo.webapp.url=${MINI_APP_URL:${BINGO_WEBAPP_URL:https://localhost:5173}}

# ===============================
# RATE LIMITING
# ===============================
bingo.rate-limit.max-requests=100
bingo.rate-limit.window-ms=60000
bingo.rate-limit.claim-max=5
bingo.rate-limit.register-max=10

# ===============================
# PAYMENT SCREENSHOT UPLOADS (local private storage)
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.screenshots.dir=${SCREENSHOTS_DIR:./data/screenshots}

# ===============================
# SCHEDULED TASKS
# ===============================
bingo.schedules.cleanup-interval-ms=600000
bingo.schedules.stale-registration-hours=24
bingo.schedules.stale-claim-minutes=30
bingo.schedules.stale-in-progress-hours=6

# ===============================
# GAME AUTOMATION
# ===============================
# Automatic games whose registration stayed below 2 players this long are
# cancelled (refunded) so the automation loop can open a fresh table.
bingo.automation.stale-registration-minutes=30
