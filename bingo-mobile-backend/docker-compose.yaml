name: bingo-mobile

# INDIVIDUAL backend only — for local testing. The full stack (postgres +
# backend + web frontend) for Coolify deployment lives in the repository root:
# ../docker-compose.yaml. Run this file with:  docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      POSTGRES_DB: ${POSTGRES_DB:-bingo_mobile}
    volumes:
      - mobile-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bingo} -d ${POSTGRES_DB:-bingo_mobile}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mobile-backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      MASTER_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bingo_mobile}
      MASTER_DB_USERNAME: ${POSTGRES_USER:-bingo}
      MASTER_DB_PASSWORD: ${POSTGRES_PASSWORD}
      TENANT_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bingo_mobile}
      TENANT_DB_USERNAME: ${POSTGRES_USER:-bingo}
      TENANT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      tenant.datasource.default-database: ${POSTGRES_DB:-bingo_mobile}

      # Phone + password auth only — no Telegram bot on this backend.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set (>= 32 chars)}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-10080}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}

      # Mini App backend owns the Telegram bot — deliberately NOT passed here,
      # so this backend always boots bot-free (phone+password auth only).
      SCREENSHOTS_DIR: /data/screenshots
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1024m
    volumes:
      - mobile-screenshots:/data/screenshots
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mobile-backend

volumes:
  mobile-pgdata:
  mobile-screenshots:

networks:
  mobile-backend: